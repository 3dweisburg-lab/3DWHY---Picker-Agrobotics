<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>יוסי רוזנבלום</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1c2430;
    --muted: #5f6b7a;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --border: #e1e6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151c;
      --card: #1a212b;
      --text: #eef2f6;
      --muted: #9aa6b5;
      --accent: #4c8dff;
      --accent-text: #08111f;
      --border: #2a3441;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Arial Hebrew", Arial, sans-serif;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 24px 32px;
    text-align: center;
  }
  .lang {
    position: absolute;
    top: 12px;
    inset-inline-end: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .avatar {
    position: relative;
    width: 112px;
    height: 112px;
    margin: 0 auto 16px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 44px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .role { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--accent);
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.secondary { background: transparent; color: var(--accent); }
  .hint { margin-top: 20px; font-size: 13px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
  <main class="card">
    <button class="lang" id="langBtn" type="button">English</button>

    <div class="avatar">
      <span id="initial">י</span>
      <img id="photo" src="photo.jpg" alt="" onerror="this.remove()">
    </div>
    <h1 id="name">יוסי רוזנבלום</h1>
    <p class="role"><span dir="ltr">picker-ag.com</span></p>

    <a class="btn primary" id="save" href="contact.vcf" download="contact.vcf">שמירת איש קשר</a>
    <a class="btn secondary" id="call" href="tel:+972525014936">התקשרות</a>
    <a class="btn secondary" id="mail" href="mailto:Yossi@picker-ag.com">שליחת דוא״ל</a>
    <a class="btn secondary" id="web" href="https://picker-ag.com/">לאתר</a>

    <p class="hint" id="hint">באנדרואיד, יש ללחוץ על הקובץ שהורד (או על כפתור "פתיחה" בדפדפן) כדי להוסיף את איש הקשר.</p>
  </main>

<script>
  var text = {
    he: {
      dir: "rtl", title: "יוסי רוזנבלום", name: "יוסי רוזנבלום", initial: "י",
      toggle: "English", vcf: "contact.vcf",
      save: "שמירת איש קשר", call: "התקשרות", mail: "שליחת דוא״ל", web: "לאתר",
      hint: "באנדרואיד, יש ללחוץ על הקובץ שהורד (או על כפתור \"פתיחה\" בדפדפן) כדי להוסיף את איש הקשר."
    },
    en: {
      dir: "ltr", title: "Yossi Rosenblum", name: "Yossi Rosenblum", initial: "Y",
      toggle: "עברית", vcf: "contact-en.vcf",
      save: "Save contact", call: "Call", mail: "Send email", web: "Visit website",
      hint: "On Android, tap the downloaded file (or the \"Open\" button in your browser) to add the contact."
    }
  };

  function setLang(lang) {
    var t = text[lang];
    var html = document.documentElement;
    html.lang = lang;
    html.dir = t.dir;
    document.title = t.title;
    document.getElementById("name").textContent = t.name;
    document.getElementById("initial").textContent = t.initial;
    document.getElementById("photo") && (document.getElementById("photo").alt = t.name);
    document.getElementById("langBtn").textContent = t.toggle;
    var save = document.getElementById("save");
    save.textContent = t.save;
    save.href = t.vcf;
    save.setAttribute("download", t.vcf);
    document.getElementById("call").textContent = t.call;
    document.getElementById("mail").textContent = t.mail;
    document.getElementById("web").textContent = t.web;
    document.getElementById("hint").textContent = t.hint;
    current = lang;
  }

  var current = "he";
  document.getElementById("langBtn").addEventListener("click", function () {
    setLang(current === "he" ? "en" : "he");
  });
</script>
</body>
</html>
