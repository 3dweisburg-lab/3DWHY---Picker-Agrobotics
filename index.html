<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yan – Contact</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1c2430;
    --muted: #5f6b7a;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --border: #e1e6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151c;
      --card: #1a212b;
      --text: #eef2f6;
      --muted: #9aa6b5;
      --accent: #4c8dff;
      --accent-text: #08111f;
      --border: #2a3441;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  .avatar {
    width: 72px;
    height: 72px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 30px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .role { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--accent);
  }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.secondary { background: transparent; color: var(--accent); }
  .hint { margin-top: 20px; font-size: 13px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">Y</div>
    <h1>Yan</h1>
    <p class="role">3dwhy.co.il</p>

    <a class="btn primary" href="contact.vcf" download="contact.vcf">Save contact</a>
    <a class="btn secondary" href="tel:+972503047511">Call me</a>
    <a class="btn secondary" href="https://www.3dwhy.co.il">Visit website</a>

    <p class="hint">On Android, tap the downloaded file (or the "Open" button in your browser) to add me to your contacts.</p>
  </main>
</body>
</html>
